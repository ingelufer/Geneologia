<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Analizar Rostros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container bg-white shadow-sm p-4 rounded">
        <h2 class="mb-4">Resultados del Análisis</h2>
        
        <form method="POST" action="{% url 'guardar_rostro' %}">
            {% csrf_token %}
            <input type="hidden" name="drive_file_id" value="{{ file_id }}">

            <div class="d-flex flex-wrap gap-4">
                {% for i in total_caras %}
                <div class="card text-center shadow-sm" style="width: 180px;">
                    <img src="{{ MEDIA_URL }}temp_caras/cara_{{ i }}.jpg" class="card-img-top" alt="Rostro">
                    <div class="card-body">
                        <label class="form-label small">¿Quién es?</label>
                        <select name="familiar_{{ i }}" class="form-select form-select-sm">
                            <option value="">--- Seleccionar ---</option>
                            {% for f in familiares %}
                                <option value="{{ f.id }}">{{ f.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                {% endfor %}
            </div>

            <div class="mt-5 d-flex gap-3">
                <button type="submit" class="btn btn-success px-4">Guardar todos en la BD</button>
                <a href="{% url 'descartar_foto' file_id %}" class="btn btn-danger px-4">Descartar esta foto</a>
                <a href="{% url 'ver_fotos' %}" class="btn btn-outline-secondary px-4">Volver</a>
            </div>
        </form>
    </div>
</body>
</html>
