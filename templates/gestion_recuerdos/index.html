<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Genealogía IA - Menú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .menu-card { transition: transform 0.2s; cursor: pointer; }
        .menu-card:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5 text-center">
        <h1 class="display-4 mb-4">🌳 Sistema de Genealogía</h1>
        <p class="lead text-muted mb-5">Gestión inteligente de recuerdos familiares</p>

        <div class="row g-4 justify-content-center">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm menu-card">
                    <div class="card-body">
                        <h2 class="h4">1. Explorar Drive</h2>
                        <p>Busca fotos nuevas en tus carpetas de Google Drive.</p>
                        <a href="{% url 'listar_fotos' %}" class="btn btn-primary w-100">Ir a Listado</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card h-100 shadow-sm menu-card">
                    <div class="card-body">
                        <h2 class="h4">2. Ver Galería</h2>
                        <p>Mira las fotos ya clasificadas de Valery, Paola y más.</p>
                        <a href="{% url 'ver_galeria' %}" class="btn btn-success w-100">Ir a Galería</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
